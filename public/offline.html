<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#a10409" />
    <title>Offline — SAMIDAK</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: linear-gradient(160deg, #fafaf9 0%, #fff 45%, #f5f5f4 100%);
        color: #1f2937;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        width: 100%;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 1rem;
        padding: 1.75rem 1.5rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }
      .mark {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, #a10409, #7a0307);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.925rem;
        line-height: 1.5;
        color: #4b5563;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        min-height: 44px;
        padding: 0.75rem 1.25rem;
        font-size: 0.925rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(to right, #a10409, #7a0307);
        cursor: pointer;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true"></div>
      <h1>You’re offline</h1>
      <p>
        SAMIDAK can’t reach the network right now. Previously opened pages and your saved documents
        may still work once you’re back online or after a reconnect.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
